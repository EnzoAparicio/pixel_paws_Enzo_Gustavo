name: apply

# En merge a main: apply con aprobacion manual del environment production.
on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: pixelpaws-estado # nunca dos apply sobre el mismo state
  cancel-in-progress: false

env:
  TF_VERSION: "1.17.2"
  AWS_REGION: us-east-2
  # Los mails no estan en el repo (es publico): vienen de un secret.
  TF_VAR_emails_alerta: ${{ secrets.EMAILS_ALERTA }}
  TF_VAR_repositorio_github: ${{ github.repository }}

jobs:
  apply:
    runs-on: ubuntu-latest
    # production exige un revisor distinto de quien disparo el deploy (apply controlado).
    environment: production

    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Validar ARN del rol OIDC
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
        run: |
          if [ -z "$AWS_ROLE_ARN" ]; then
            echo "::error::Falta el secret AWS_ROLE_ARN. Cargá el valor de 'terraform -chdir=terraform output -raw rol_github_arn' en Settings > Secrets and variables > Actions."
            exit 1
          fi

      # OIDC: GitHub pide un token de corta vida y asume el rol. Sin claves guardadas.
      - name: Credenciales AWS
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: github-${{ github.run_id }}

      - name: Init
        run: terraform -chdir=terraform init -input=false -backend-config=backend.hcl

      - name: Plan
        run: terraform -chdir=terraform plan -input=false -out=tfplan

      - name: Apply
        run: terraform -chdir=terraform apply -input=false tfplan

      - name: Resumen
        run: |
          {
            echo "### Despliegue correcto"
            echo ""
            echo '```'
            terraform -chdir=terraform output
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
