name: destroy

# Manual: destruye todo y deja evidencia de que la cuenta quedo limpia.
# La aprobacion del environment production es la unica guarda: no pide confirmacion escrita.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: pixelpaws-estado
  cancel-in-progress: false

env:
  TF_VERSION: "1.17.2"
  AWS_REGION: us-east-2
  # Los mails no estan en el repo (es publico): vienen de un secret.
  TF_VAR_emails_alerta: ${{ secrets.EMAILS_ALERTA }}
  TF_VAR_repositorio_github: ${{ github.repository }}

jobs:
  destroy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      # OIDC: GitHub pide un token de corta vida y asume el rol. Sin claves guardadas.
      - name: Credenciales AWS
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: github-${{ github.run_id }}

      - name: Init
        run: terraform -chdir=terraform init -input=false -backend-config=backend.hcl

      - name: Destroy
        run: terraform -chdir=terraform destroy -input=false -auto-approve

      - name: Evidencia de cuenta limpia
        run: |
          {
            echo "### Recursos restantes"
            echo ""
            echo '```'
            echo "Lambdas:"; aws lambda list-functions --query "Functions[?starts_with(FunctionName,'pixelpaws')].FunctionName" --output text
            echo "Tablas:";  aws dynamodb list-tables --query "TableNames[?starts_with(@,'pixelpaws')]" --output text
            echo "Buckets:"; aws s3 ls | grep pixelpaws || echo "ninguno"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
