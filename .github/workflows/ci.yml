name: ci

# En cada PR: fmt, validate, tflint, Checkov y el plan como comentario (consigna 2.4).
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write # necesario para OIDC
  pull-requests: write # para comentar el plan

concurrency:
  group: pixelpaws-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.17.2"
  AWS_REGION: us-east-2
  # Los mails no estan en el repo (es publico): vienen de un secret.
  TF_VAR_emails_alerta: ${{ secrets.EMAILS_ALERTA }}
  TF_VAR_repositorio_github: ${{ github.repository }}

jobs:
  calidad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Formato
        run: terraform -chdir=terraform fmt -check -recursive

      # OIDC esta bloqueado por la SCP: credenciales temporales (12 h) del rol pixelpaws-ci.
      - name: Credenciales AWS
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}

      - name: Init
        run: terraform -chdir=terraform init -input=false -backend-config=backend.hcl

      - name: Validate
        run: terraform -chdir=terraform validate

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: latest

      - name: tflint
        run: |
          tflint --init
          tflint --recursive --format compact

      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform
          framework: terraform
          quiet: true
          soft_fail: false
          # Supresiones justificadas en docs/seguridad.md, seccion "Hallazgos aceptados".
          skip_check: CKV_AWS_18,CKV_AWS_144,CKV_AWS_28,CKV_AWS_119,CKV2_AWS_62,CKV_AWS_158,CKV_AWS_116,CKV_AWS_338,CKV_AWS_117,CKV_AWS_50,CKV_AWS_272,CKV_AWS_173,CKV_AWS_26,CKV_AWS_145,CKV2_AWS_61

      - name: Plan
        id: plan
        run: terraform -chdir=terraform plan -input=false -no-color -out=tfplan 2>&1 | tee plan.txt

      - name: Comentar el plan en el PR
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync('plan.txt', 'utf8');
            if (plan.length > 60000) plan = plan.slice(0, 60000) + '\n... recortado ...';
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Terraform plan\n\n<details><summary>Ver plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n\n</details>`
            });
